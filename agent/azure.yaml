# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Foundry demo — two hosted agents in one azd project.
# Shape follows microsoft-foundry/foundry-samples (python/hosted-agents/*/azure.yaml) and the
# azure.yaml reference: learn.microsoft.com/azure/foundry/agents/concepts/azure-yaml-reference
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: foundry-demo-hosted-agents

services:
  # ---- connect to your EXISTING Foundry project (no new project, no new deployment managed by azd) ----
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}     # set with: azd env set FOUNDRY_PROJECT_ENDPOINT https://<account>.services.ai.azure.com/api/projects/<project>
    # To let azd create the model deployment instead, remove `endpoint` and add:
    # deployments:
    #   - name: gpt-5.4-mini
    #     model: { format: OpenAI, name: gpt-5.4-mini, version: '2026-03-17' }
    #     sku:   { name: GlobalStandard, capacity: 10 }

  # ---- Agent 1: plain hosted agent on Microsoft Agent Framework, Responses protocol ----
  demo-hosted-agent:
    host: azure.ai.agent
    project: src/demo-hosted-agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: demo-hosted-agent
    description: Agent Framework agent hosted by Foundry — Responses protocol, one function tool, OpenTelemetry on by default.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}   # azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME <chat-deployment>
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

  # ---- Agent 2: long-running agent — resilient background execution + steering (preview) ----
  demo-long-running-agent:
    host: azure.ai.agent
    project: src/demo-long-running-agent
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: demo-long-running-agent
    description: Procurement decision briefs with model-backed risk assessment, mitigation planning, checkpoint recovery and steering.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      SIMULATE_CRASH_AFTER_STAGE: ${SIMULATE_CRASH_AFTER_STAGE}          # leave empty in the cloud; set to 0 locally to demo recovery
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      DEMO_STAGE_DELAY_SECONDS: '10'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

infra:
  provider: microsoft.foundry
